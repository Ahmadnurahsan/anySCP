name: Build Windows App

on:
  push:
    branches: [ main, feature/* ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows 10 x64 (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "anySCP v__VERSION__"
          releaseBody: "Automated release build for Windows x64"
          releaseDraft: true
          prerelease: false

      - name: Upload Build Artifacts (Exe & Msi)
        uses: actions/upload-artifact@v4
        with:
          name: anySCP-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
